<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Comparison Scanner | Performance Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            color: #e9ecef;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        select {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            transition: all 0.3s ease;
        }

        select:focus {
            border-color: #4cc9f0 !important;
            box-shadow: 0 0 15px rgba(76, 201, 240, 0.2);
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(90deg, #4cc9f0, #4361ee);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 201, 240, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 201, 240, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loader {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #4cc9f0;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .perf-cell {
            width: 120px;
            min-height: 80px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 8px 6px;
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: default;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .perf-cell:hover {
            transform: scale(1.07);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            z-index: 10;
            position: relative;
        }

        .cell-pct {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .cell-price {
            font-size: 9px;
            font-weight: 600;
            opacity: 0.8;
            letter-spacing: 0.3px;
            text-align: center;
            line-height: 1.4;
        }

        .strong-pos { background: #34d399; color: #064e3b; }
        .moderate-pos { background: #fbbf24; color: #78350f; }
        .moderate-neg { background: #fb923c; color: #7c2d12; }
        .strong-neg { background: #f87171; color: #7f1d1d; }

        table thead th {
            padding: 14px 10px;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 900;
            color: #6b7280;
            letter-spacing: 0.1em;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            min-width: 130px;
            background: rgba(255, 255, 255, 0.02);
        }

        table tbody td {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: middle;
        }

        .index-name-col {
            font-weight: 700;
            color: white;
            font-size: 13px;
            position: sticky;
            left: 0;
            z-index: 10;
            background: #16213e;
            box-shadow: 5px 0 10px rgba(0,0,0,0.3);
            white-space: nowrap;
            padding: 10px 16px;
            min-width: 160px;
        }
    </style>
</head>

<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1
                class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">
                Indices Side-by-Side
            </h1>
            <div class="flex items-center justify-center space-x-4">
                <p class="text-gray-400 text-lg font-light tracking-wide">Multi-Index Comparative Performance</p>
                <a href="/" class="text-cyan-400 hover:text-cyan-300 text-sm font-bold uppercase tracking-widest border border-cyan-400/30 px-3 py-1 rounded-full bg-cyan-400/5 transition">Main Scanner</a>
            </div>
        </header>

        <!-- Selection Controls -->
        <div class="glass p-8 mb-8">
            <div class="flex flex-col md:flex-row gap-6 items-end justify-center">
                <div class="space-y-2 w-full md:w-64">
                    <label class="block text-[10px] uppercase font-black text-gray-500 tracking-widest">Duration</label>
                    <select id="duration-select" class="w-full rounded-xl px-4 py-3 text-sm">
                        <option value="3">Last 3 Months</option>
                        <option value="6">Last 6 Months</option>
                        <option value="9">Last 9 Months</option>
                        <option value="12">Last 1 Year</option>
                    </select>
                </div>

                <div class="space-y-2 w-full md:w-64">
                    <label class="block text-[10px] uppercase font-black text-gray-500 tracking-widest">Interval</label>
                    <div class="flex p-1 bg-white/5 rounded-xl border border-white/10">
                        <button id="btn-monthly" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-300 bg-cyan-500/20 text-cyan-400">Monthly</button>
                        <button id="btn-weekly" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-300 text-gray-500 hover:text-white">Weekly</button>
                    </div>
                </div>

                <button id="scan-btn" class="btn-primary w-full md:w-48 py-3 rounded-xl font-bold uppercase tracking-wider text-sm flex items-center justify-center space-x-2 h-[46px]">
                    <span>Compare All</span>
                    <div id="btn-loader" class="loader hidden"></div>
                </button>
            </div>
        </div>

        <!-- Table Container -->
        <div id="results-container" class="hidden glass overflow-hidden border border-white/10 shadow-2xl mb-10">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead id="table-head">
                        <!-- Headers injected here -->
                    </thead>
                    <tbody id="table-body">
                        <!-- Rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="py-40 text-center text-gray-600 uppercase font-black tracking-[1em] text-xs">
            Scan to compare indices
        </div>

        <!-- Metrics Legend -->
        <div class="glass p-6 mb-10 flex flex-wrap items-center justify-center gap-6">
            <span class="text-[10px] uppercase font-black text-gray-500 tracking-widest">Performance Heatmap:</span>
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded strong-pos"></div>
                <span class="text-xs text-gray-400 font-bold">> +2.0%</span>
            </div>
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded moderate-pos"></div>
                <span class="text-xs text-gray-400 font-bold">0% to +2.0%</span>
            </div>
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded moderate-neg"></div>
                <span class="text-xs text-gray-400 font-bold">-2.0% to 0%</span>
            </div>
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded strong-neg"></div>
                <span class="text-xs text-gray-400 font-bold">< -2.0%</span>
            </div>
        </div>
    </div>

    <script>
        let currentInterval = '1mo';
        const scanBtn = document.getElementById('scan-btn');
        const btnLoader = document.getElementById('btn-loader');
        const resultsContainer = document.getElementById('results-container');
        const emptyState = document.getElementById('empty-state');
        const tableHead = document.getElementById('table-head');
        const tableBody = document.getElementById('table-body');

        const btnMonthly = document.getElementById('btn-monthly');
        const btnWeekly = document.getElementById('btn-weekly');

        btnMonthly.onclick = () => {
            currentInterval = '1mo';
            btnMonthly.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-300 bg-cyan-500/20 text-cyan-400";
            btnWeekly.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-300 text-gray-500 hover:text-white";
        };

        btnWeekly.onclick = () => {
            currentInterval = '1wk';
            btnWeekly.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-300 bg-cyan-500/20 text-cyan-400";
            btnMonthly.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-300 text-gray-500 hover:text-white";
        };

        scanBtn.onclick = async () => {
            const months = document.getElementById('duration-select').value;

            scanBtn.disabled = true;
            btnLoader.classList.remove('hidden');
            emptyState.classList.add('hidden');

            try {
                const response = await fetch(`/all_indices_data?months=${months}&interval=${currentInterval}`);
                const data = await response.json();

                if (data.error || data.detail) {
                    alert(data.error || data.detail || "Unknown server error");
                    emptyState.classList.remove('hidden');
                    return;
                }

                renderTable(data);
            } catch (error) {
                alert("Failed to fetch data: " + error.message);
                emptyState.classList.remove('hidden');
            } finally {
                scanBtn.disabled = false;
                btnLoader.classList.add('hidden');
            }
        };

        function getBadgeClass(val) {
            if (val > 2) return 'strong-pos';
            if (val > 0) return 'moderate-pos';
            if (val > -2) return 'moderate-neg';
            return 'strong-neg';
        }

        function formatPrice(p) {
            if (p >= 1000) return p.toLocaleString('en-IN', {maximumFractionDigits: 0});
            return p.toFixed(2);
        }

        function renderTable(data) {
            resultsContainer.classList.remove('hidden');
            
            // Render Head
            let headHtml = `<tr><th class="index-name-col" style="text-align:left">Parameter (Index)</th>`;
            data.periods.forEach(p => {
                headHtml += `<th>${p}</th>`;
            });
            headHtml += `</tr>`;
            tableHead.innerHTML = headHtml;

            // Render Body
            tableBody.innerHTML = data.indices.map(index => {
                let rowHtml = `<tr><td class="index-name-col">${index.name}</td>`;
                
                data.periods.forEach(p => {
                    const res = index.results.find(r => r.period === p);
                    if (res) {
                        const bClass = getBadgeClass(res.p_close);
                        const pct = (res.p_close >= 0 ? '+' : '') + res.p_close + '%';
                        const openStr = res.open  ? 'O: ' + formatPrice(res.open)  : '';
                        const closeStr = res.close ? 'C: ' + formatPrice(res.close) : '';
                        rowHtml += `
                            <td style="text-align:center; padding: 8px;">
                                <div class="perf-cell ${bClass}">
                                    <span class="cell-pct">${pct}</span>
                                    <span class="cell-price">${openStr}<br>${closeStr}</span>
                                </div>
                            </td>
                        `;
                    } else {
                        rowHtml += `<td style="text-align:center; color:#374151; font-weight:bold;">–</td>`;
                    }
                });
                
                rowHtml += `</tr>`;
                return rowHtml;
            }).join('');
        }
    </script>
</body>

</html>
